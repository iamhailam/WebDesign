name: Approved delivery (manual CD)
on:
  workflow_dispatch:
    inputs:
      release_approved:
        description: PO/Ops approved hosting, budget, release gates and this revision
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: production-delivery
  cancel-in-progress: false
jobs:
  configuration:
    if: github.ref == 'refs/heads/main' && inputs.release_approved
    runs-on: ubuntu-latest
    outputs:
      api_base: ${{ steps.api.outputs.api_base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Validate repository production API base
        id: api
        env:
          PRODUCTION_API_BASE: ${{ vars.PRODUCTION_API_BASE }}
          RELEASE_BUILD: 'true'
        run: node scripts/configure-api-base.mjs
  quality:
    needs: configuration
    uses: ./.github/workflows/ci.yml
    with:
      production_api_base: ${{ needs.configuration.outputs.api_base }}
      release_build: true
  handoff:
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.quality.outputs.artifact_name }}
          path: delivery
      - name: Verify approved artifact and captured API base
        env:
          EXPECTED_API_BASE: ${{ needs.quality.outputs.api_base }}
        run: |
          cd delivery
          sha256sum -c SHA256SUMS
          cd ..
          node scripts/verify-build-api-base.mjs delivery/release/frontend delivery/release/PUBLIC_API_BASE
      - name: Record manual deployment instructions
        env:
          ARTIFACT_NAME: ${{ needs.quality.outputs.artifact_name }}
          API_BASE: ${{ needs.quality.outputs.api_base }}
        run: |
          {
            echo "Approved revision: $GITHUB_SHA"
            echo "Verified artifact: $ARTIFACT_NAME"
            echo "Validated build API base: $API_BASE"
            echo "Ops: follow docs/DEPLOYMENT.md for backup, migration, backend then frontend promotion and smoke checks."
            echo "No external deployment or paid resource creation is automated by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
